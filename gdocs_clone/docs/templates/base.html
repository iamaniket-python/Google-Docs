{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Inkwell{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================
       Inkwell design system
       "Paper and ink": cool neutral surfaces, one confident ink
       accent, sans UI chrome vs. serif writing surface.
       ========================================================== */
    :root {
      /* Palette */
      --color-bg: #eef0f2;
      --color-surface: #ffffff;
      --color-surface-sunken: #f5f6f8;
      --color-border: #dde1e6;
      --color-border-strong: #c7cdd4;

      --color-ink: #20242b;
      --color-ink-muted: #5b6470;
      --color-ink-faint: #8991a0;

      --color-accent: #2f6b4f;
      --color-accent-hover: #24543e;
      --color-accent-soft: #e6efe9;

      --color-danger: #c1443c;
      --color-danger-soft: #fbebea;
      --color-warn: #a8722a;
      --color-warn-soft: #faf1e3;
      --color-success: #2f6b4f;
      --color-success-soft: #e6efe9;

      /* Type */
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-doc: "Source Serif 4", Georgia, "Times New Roman", serif;

      /* Elevation */
      --shadow-sm: 0 1px 2px rgba(23, 26, 31, 0.06);
      --shadow-md: 0 4px 16px rgba(23, 26, 31, 0.08);
      --shadow-lg: 0 12px 32px rgba(23, 26, 31, 0.12);

      /* Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      /* Rhythm */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      color: var(--color-ink);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* ---------- Layout shell ---------- */
    .app-shell {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-6);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .topbar__brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: 700;
      font-size: 17px;
      color: var(--color-ink);
    }

    .topbar__brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--color-accent);
      flex-shrink: 0;
    }

    .topbar__actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 14px;
      color: var(--color-ink-muted);
    }

    .main {
      flex: 1;
      width: 100%;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-5);
    }

    /* ---------- Buttons ---------- */
    .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease,
                  color 120ms ease, box-shadow 120ms ease, transform 80ms ease;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--color-accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }

    .btn-secondary {
      background: var(--color-surface);
      border-color: var(--color-border-strong);
      color: var(--color-ink);
    }
    .btn-secondary:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-ink-muted);
      border-color: transparent;
    }
    .btn-ghost:hover {
      background: var(--color-surface-sunken);
      color: var(--color-ink);
    }

    .btn-danger {
      background: var(--color-danger-soft);
      color: var(--color-danger);
    }
    .btn-danger:hover { background: #f6d9d7; }

    .btn-block { width: 100%; }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ---------- Form fields ---------- */
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-ink-muted);
    }

    .input {
      width: 100%;
      padding: 11px 14px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--color-ink);
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .input::placeholder { color: var(--color-ink-faint); }

    .input:hover { border-color: var(--color-ink-faint); }

    .input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-soft);
    }

    select.input {
      cursor: pointer;
    }

    /* ---------- Status / message banners ---------- */
    .message {
      display: none;
      align-items: center;
      gap: var(--space-2);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: var(--space-4);
    }

    .message:not(:empty) { display: flex; }

    .message--error {
      background: var(--color-danger-soft);
      color: var(--color-danger);
    }

    .message--success {
      background: var(--color-success-soft);
      color: var(--color-success);
    }

    .message--warn {
      background: var(--color-warn-soft);
      color: var(--color-warn);
    }

    .message--muted {
      background: var(--color-surface-sunken);
      color: var(--color-ink-muted);
    }

    /* Inline status dot, used inside status-msg style pills */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-ink-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-ink-faint);
      flex-shrink: 0;
    }

    /* ---------- Utility ---------- */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .topbar { padding: var(--space-3) var(--space-4); }
      .container { padding: var(--space-5) var(--space-4); }
    }

    {% block extra_style %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    {% block topbar %}
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__brand-mark" aria-hidden="true"></span>
        <span>Inkwell</span>
      </div>
      <div class="topbar__actions">
        {% block topbar_actions %}{% endblock %}
      </div>
    </header>
    {% endblock %}

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block extra_script %}{% endblock %}
</body>
</html>
