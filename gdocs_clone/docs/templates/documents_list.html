{% extends "base.html" %}
{% block title %}My Documents{% endblock %}
{% block content %}
    <div class="navbar">
        <span class="brand">📄 Docs Clone</span>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>My Documents</h2>
            <div class="form-row">
                <input type="text" id="new-doc-title" placeholder="New document title" style="flex:1;">
                <button onclick="createDocument()">+ Create Document</button>
            </div>
            <p class="error" id="error-msg"></p>
        </div>

        <div id="doc-list"></div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login/';
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login/';
        }

        async function loadDocuments() {
            const response = await fetch('/api/documents/', {
                headers: { 'Authorization': `Bearer ${token}` },
            });

            if (response.status === 401) {
                localStorage.clear();
                window.location.href = '/login/';
                return;
            }

            const docs = await response.json();
            const listDiv = document.getElementById('doc-list');
            listDiv.innerHTML = '';

            docs.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'doc-item';
                div.innerText = `${doc.title} (v${doc.version}) — owner: ${doc.owner}`;
                div.onclick = () => {
                    window.location.href = `/documents/${doc.id}/`;
                };
                listDiv.appendChild(div);
            });
        }

        async function createDocument() {
            const title = document.getElementById('new-doc-title').value;
            if (!title) return;

            const response = await fetch('/api/documents/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify({ title, content: '' }),
            });

            if (response.ok) {
                document.getElementById('new-doc-title').value = '';
                loadDocuments();
            } else {
                document.getElementById('error-msg').innerText = 'Failed to create document.';
            }
        }

        loadDocuments();
    </script>
{% endblock %}
